name: Update Leaderboard

on:
  workflow_dispatch:
  schedule:
    # Yedek senkron (GitHub Actions gecikmesi olabilir)
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    # Otomatik JSON commit'leri yeniden tetiklemesin (yarış / gereksiz çalışma)
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  repository_dispatch:
    types: [leaderboard-update]

# Ayni anda tek guncelleme: paralel push catismasi ve mail spam'i onlenir.
# Oyun icindeki canli Firebase listesi etkilenmez (yalnizca statik web JSON).
concurrency:
  group: leaderboard-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip firebase-admin

      - name: Run leaderboard updater
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_KEY_BASE64: ${{ secrets.FIREBASE_KEY_BASE64 }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          if git diff --staged --quiet; then
            echo "No leaderboard changes to commit."
            exit 0
          fi
          git commit -m "📊 Global Leaderboard Auto-Update"
          git pull --rebase origin main
          git push origin main
