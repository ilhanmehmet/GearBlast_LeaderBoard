name: Update Leaderboard

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # Her 6 saatte bir (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:               # Manuel tetikleme butonu

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Run leaderboard updater
        env:
          FIREBASE_KEY:    ${{ secrets.FIREBASE_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏆 Leaderboard updated [skip ci]"
          file_pattern: data/leaderboard.json
