name: Update Leaderboard

on:
  workflow_dispatch:
  schedule:
    # Her 5 dakikada bir (GitHub Actions gecikmesi olabilir)
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    # Otomatik JSON commit'leri yeniden tetiklemesin (yarış / gereksiz çalışma)
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  repository_dispatch:
    types: [leaderboard-update]

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip firebase-admin

      - name: Run leaderboard updater
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_KEY_BASE64: ${{ secrets.FIREBASE_KEY_BASE64 }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Global Leaderboard Auto-Update"
          file_pattern: data/leaderboard.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
